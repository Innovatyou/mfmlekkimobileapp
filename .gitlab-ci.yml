image: ghcr.io/cirruslabs/flutter:3.24.5

stages:
  - validate

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .pub-cache/
    - .dart_tool/

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

before_script:
  - flutter --version
  - flutter pub get

analyze:
  stage: validate
  script:
    - flutter analyze
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
